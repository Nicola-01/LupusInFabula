<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test WebSocket Java</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; background: #f9f9f9; margin-top: 10px;}
        .msg-out { color: blue; }
        .msg-in { color: green; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>

<h2>Test WebSocket Java Servlet</h2>

<div>
    <input type="text" id="messageInput" placeholder="Scrivi un messaggio..." onkeydown="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Invia</button>
    <button onclick="closeConnection()" style="background-color: #ffcccc;">Chiudi Connessione</button>
</div>

<div id="log"></div>

<script>
    var socket;

    // COSTRUIAMO L'URL DINAMICAMENTE
    // Se il tuo sito è http, usa ws://. Se è https, usa wss://
    var protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    // Attenzione: sostituisci 'TuoProgetto' con il nome del contesto della tua app (o rimuovilo se sei in root)
    var wsUrl = protocol + window.location.host + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + "/echo";

    // Oppure hardcodalo per testare in locale:
    // var wsUrl = "ws://localhost:8080/TuoNomeProgetto/echo";

    function connect() {
        log("Tentativo di connessione a: " + wsUrl);

        socket = new WebSocket(wsUrl);

        socket.onopen = function(event) {
            log("Connessione APERTA!", "green");
        };

        socket.onmessage = function(event) {
            log("Server: " + event.data, "msg-in");
        };

        socket.onclose = function(event) {
            log("Connessione CHIUSA.", "red");
        };

        socket.onerror = function(event) {
            log("ERRORE WebSocket.", "error");
        };
    }

    function sendMessage() {
        var input = document.getElementById("messageInput");
        var message = input.value;

        if (socket.readyState === WebSocket.OPEN) {
            socket.send(message);
            log("Tu: " + message, "msg-out");
            input.value = "";
        } else {
            log("Errore: La connessione non è aperta.", "error");
        }
    }

    function closeConnection() {
        socket.close();
    }

    function log(text, type) {
        var logDiv = document.getElementById("log");
        var entry = document.createElement("div");
        entry.textContent = new Date().toLocaleTimeString() + " - " + text;
        if (type) entry.className = type;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll
    }

    // Avvia connessione al caricamento pagina
    connect();
</script>

</body>
</html>
