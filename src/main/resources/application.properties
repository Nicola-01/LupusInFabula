server.port=9090

# same database and credentials as the old META-INF/context.xml (host "db" inside docker compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=lupus_sql
spring.datasource.password=${DB_PASSWORD:wolf}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

logging.config=classpath:log4j2.xml

# shown in the footer via /config.js; set by CI from the release git tag
app.version=${APP_VERSION:dev}
