spring.application.name=lupus
server.port=9090

# Database: the postgres of backend/compose.yaml (host port 5434)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/lupus}
spring.datasource.username=${DB_USER:lupus}
spring.datasource.password=${DB_PASSWORD:lupus}

# JPA: Hibernate creates/updates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session cookie (JSESSIONID): sessions live in memory, 30 minutes of inactivity (Tomcat default)
server.servlet.session.cookie.same-site=lax
# Behind a reverse proxy: trust X-Forwarded-* so request.isSecure() is true on https (Secure cookies)
server.forward-headers-strategy=framework

# Remember-me ("keep me logged in"): key that signs the cookie. Override with REMEMBER_ME_KEY in production.
app.remember-me.key=${REMEMBER_ME_KEY:dev-only-remember-me-key-change-me}

# Logs: console only (Logback, Boot default). The MDC values user/ip are added to every line by LogContextFilter.
logging.level.dev.busato.lupus=INFO
logging.pattern.level=%5p [%X{user:-anonymous} %X{ip:-}]
