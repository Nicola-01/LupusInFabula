<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>background</title>
    <style>
        /* Day is the default when the host sets no data-bs-theme. */
        :root, [data-bs-theme="light"] {
            --sky-top: #cddcd8;
            --sky-bottom: #f3e4c3;
            --sun: #f6cf6a;
            --sun-halo: rgba(246, 207, 106, .35);
            --moon-op: 0;
            --sun-op: 1;
            --star-op: 0;
            --cloud: #fbf4e4;
            --cloud-op: .9;
            --hill-far: #b3bf8e;
            --hill-mid: #9db27c;
            --ground: #8fa86f;
            --dirt: #d9c69e;
            --dirt-edge: #c8b285;
            --tree: #3f7a4d;
            --tree-dark: #2f5d3a;
            --trunk: #6b4527;
            --plaster: #f4e9d1;
            --timber: #5a3d26;
            --thatch: #cfa64c;
            --thatch-line: #a9822f;
            --stone: #b9aa8f;
            --stone-dark: #8d7d63;
            --stone-top: #d2c4a8;
            --tile: #a24d2f;
            --tile-line: #7d3820;
            --wood: #7a5232;
            --wood-dark: #5a3d26;
            --wood-end: #d1a86d;
            --metal: #5f5a52;
            --bucket: #7a5232;
            --window: #7b8d8f;
            --window-frame: #5a3d26;
            --win-glow-op: 0;
            --win-anim: none;
            --smoke: #444;
            --chimney-smoke: #6b5d4c;
            --fire-glow: rgba(255, 255, 255, .7);
            --fire-light-op: .25;
            --firefly-op: 0;
            --flame-yellow: #FDE26C;
            --flame-orange: #FDA263;
            --flame-core: #fff8e6;
            --shadow: rgba(60, 40, 20, .18);
        }

        [data-bs-theme="dark"] {
            --sky-top: #0c1119;
            --sky-bottom: #2a2119;
            --moon-op: 1;
            --sun-op: 0;
            --star-op: 1;
            --cloud-op: 0;
            --hill-far: #1c241f;
            --hill-mid: #1a221c;
            --ground: #1f281e;
            --dirt: #352a1f;
            --dirt-edge: #2c2219;
            --tree: #1a2a1f;
            --tree-dark: #132018;
            --trunk: #2b1d12;
            --plaster: #5c5040;
            --timber: #2b1d12;
            --thatch: #5a4626;
            --thatch-line: #443419;
            --stone: #4a443b;
            --stone-dark: #35302a;
            --stone-top: #5a5348;
            --tile: #4f2b1f;
            --tile-line: #3a1e15;
            --wood: #46301d;
            --wood-dark: #2b1d12;
            --wood-end: #7a5d3b;
            --metal: #8a8274;
            --bucket: #7a5d3b;
            --window: #ffcf6b;
            --window-frame: #2b1d12;
            --win-glow-op: 1;
            --win-anim: winflicker;
            --smoke: #FFF;
            --chimney-smoke: #cfc3ad;
            --fire-glow: rgba(253, 162, 99, .55);
            --fire-light-op: 1;
            --firefly-op: 1;
            --flame-yellow: #FDE26CAA;
            --flame-orange: #FDA263DD;
            --flame-core: #fff3c4;
            --shadow: rgba(0, 0, 0, .35);
        }

        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            background: linear-gradient(var(--sky-top), var(--sky-bottom) 75%);
        }

        /* Focal group stays in the lower middle, between the home panels; everything outside the
           viewBox (ground, hills, trees, sky details, smoke) spills over via overflow:visible. */
        .scene {
            position: absolute;
            left: 50%;
            bottom: 7vh;
            width: min(100vw, 500px);
            transform: translateX(-50%);
            overflow: visible;
        }

        .sun { fill: var(--sun); opacity: var(--sun-op); }
        .sun-halo { fill: var(--sun-halo); opacity: var(--sun-op); }
        .moon { opacity: var(--moon-op); }
        .stars { opacity: var(--star-op); fill: #f3e6c8; }
        .clouds { opacity: var(--cloud-op); fill: var(--cloud); }
        .hill-far { fill: var(--hill-far); }
        .hill-mid { fill: var(--hill-mid); }
        .ground { fill: var(--ground); }
        .dirt { fill: var(--dirt); }
        .dirt-edge { fill: var(--dirt-edge); }
        .tree { fill: var(--tree); }
        .tree-dark { fill: var(--tree-dark); }
        .trunk { fill: var(--trunk); }
        .plaster { fill: var(--plaster); }
        .timber { fill: none; stroke: var(--timber); stroke-width: 4; stroke-linecap: square; }
        .timber-fill { fill: var(--timber); }
        .thatch { fill: var(--thatch); }
        .thatch-line { fill: none; stroke: var(--thatch-line); stroke-width: 2; stroke-linecap: round; }
        .stone { fill: var(--stone); }
        .stone-dark { fill: var(--stone-dark); }
        .stone-top { fill: var(--stone-top); }
        .stone-line { fill: none; stroke: var(--stone-dark); stroke-width: 1.5; stroke-linecap: round; }
        .tile { fill: var(--tile); }
        .tile-line { fill: none; stroke: var(--tile-line); stroke-width: 2; }
        .wood { fill: var(--wood); }
        .wood-dark { fill: var(--wood-dark); }
        .wood-end { fill: var(--wood-end); stroke: var(--wood-dark); stroke-width: 1.5; }
        .rope { stroke: var(--wood-dark); stroke-width: 1.5; }
        .door { fill: var(--wood); stroke: var(--wood-dark); stroke-width: 2; }
        .plank { stroke: var(--wood-dark); stroke-width: 1; }
        .metal-fill { fill: var(--metal); }
        .bucket { fill: var(--bucket); }
        .band, .bucket-handle, .crank { fill: none; stroke: var(--metal); stroke-width: 1.4; stroke-linecap: round; }
        .crank { stroke: var(--wood-dark); stroke-width: 2; }
        .shadow { fill: var(--shadow); }

        .win {
            fill: var(--window);
            stroke: var(--window-frame);
            stroke-width: 2.5;
            animation: var(--win-anim) 4s ease-in-out infinite alternate;
        }
        .win-bar { stroke: var(--window-frame); stroke-width: 2; }
        .win-glow { opacity: var(--win-glow-op); }
        .w2 { animation-delay: -1.3s; animation-duration: 5s; }
        .w3 { animation-delay: -2.6s; animation-duration: 3.4s; }
        @keyframes winflicker {
            0%, 100% { opacity: 1; }
            40% { opacity: .82; }
            70% { opacity: .95; }
        }

        /* Campfire: same flames as homeBackground.html (three stacked diamonds + flicker). */
        .fire-glow-c { fill: url(#fireGlow); }
        .fire-light { opacity: var(--fire-light-op); animation: pulse 3s ease-in-out infinite alternate; }
        @keyframes pulse {
            from { opacity: calc(var(--fire-light-op) * .8); }
            to { opacity: var(--fire-light-op); }
        }
        .fire { transform: rotate(-5deg); animation: flicker 3s ease alternate infinite; }
        .flame-1 { fill: var(--flame-yellow); opacity: .4; }
        .flame-2 { fill: var(--flame-orange); opacity: .8; }
        .flame-3 { fill: var(--flame-core); opacity: .9; }
        @keyframes flicker {
            0% { transform: rotate(-1deg); }
            20% { transform: rotate(1deg); }
            40% { transform: rotate(-1deg); }
            60% { transform: rotate(1deg) scale(1.1); }
            80% { transform: rotate(-2deg) scale(1); }
            100% { transform: rotate(1deg); }
        }

        .smoke {
            fill: none;
            stroke: var(--smoke);
            opacity: .3;
            stroke-width: 5px;
            stroke-dasharray: 500 100;
            stroke-linecap: round;
            animation: dash 3s linear infinite;
        }
        @keyframes dash {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 600; }
        }
        .chimney-smoke {
            fill: none;
            stroke: var(--chimney-smoke);
            opacity: .35;
            stroke-width: 3px;
            stroke-dasharray: 60 20;
            stroke-linecap: round;
            animation: dash-small 4s linear infinite;
        }
        .chimney-smoke.c2 { animation-duration: 5s; }
        @keyframes dash-small {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 160; }
        }

        .spark { fill: var(--flame-orange); opacity: 0; animation: rise 2.4s ease-out infinite; }
        .spark:nth-child(2) { animation-delay: -.6s; animation-duration: 2.9s; }
        .spark:nth-child(3) { animation-delay: -1.2s; animation-duration: 2.2s; }
        .spark:nth-child(4) { animation-delay: -1.8s; animation-duration: 3.1s; }
        @keyframes rise {
            0% { transform: translate(0, 0); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translate(8px, -70px); opacity: 0; }
        }

        .fireflies { opacity: var(--firefly-op); fill: #f7e08a; }
        .fly { animation: drift 7s ease-in-out infinite alternate; }
        .fly:nth-child(2) { animation-delay: -2s; animation-duration: 9s; }
        .fly:nth-child(3) { animation-delay: -4s; animation-duration: 6s; }
        .fly:nth-child(4) { animation-delay: -1s; animation-duration: 8s; }
        .fly:nth-child(5) { animation-delay: -5s; animation-duration: 10s; }
        @keyframes drift {
            0% { transform: translate(0, 0); opacity: .2; }
            50% { transform: translate(10px, -8px); opacity: 1; }
            100% { transform: translate(-6px, -14px); opacity: .3; }
        }

        .twinkle { animation: twinkle 4s ease-in-out infinite alternate; }
        .twinkle:nth-child(3n) { animation-delay: -1.5s; }
        .twinkle:nth-child(3n+1) { animation-delay: -3s; }
        @keyframes twinkle {
            from { opacity: 1; }
            to { opacity: .35; }
        }

        .clouds g { animation: float 40s ease-in-out infinite alternate; }
        .clouds g + g { animation-duration: 55s; animation-direction: alternate-reverse; }
        @keyframes float {
            from { transform: translateX(-20px); }
            to { transform: translateX(20px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; }
            .spark { display: none; }
        }
    </style>
</head>
