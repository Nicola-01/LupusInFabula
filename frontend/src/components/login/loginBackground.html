<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>background</title>
    <style>
        /* Dusk is the default when the host sets no data-bs-theme. */
        :root, [data-bs-theme="light"] {
            --sky-top: #8e9db0;
            --sky-mid: #e3b98a;
            --sky-bottom: #f3d7a1;
            --moon: #fbf0d6;
            --moon-shade: #efdcb4;
            --moon-halo: rgba(255, 240, 205, .45);
            --star-op: 0;
            --hill: #a59a76;
            --cliff: #4b4436;
            --wolf: #3a3328;
            --tree-far: #959b80;
            --tree-mid: #64704f;
            --tree-near: #3d4a33;
            --ground: #6d6a45;
            --dirt: #b89466;
            --bark-dark: #4a3220;
            --bark-mid: #6b4527;
            --bark-lit: #a8713f;
            --bark-line: #3a2617;
            --wood-end: #d6ab72;
            --ring: #a67c48;
            --wood-hi: #f0d29a;
            --moss: #6f7d3a;
            --rim: #ffd08a;
            --mushroom: #b5432c;
            --stone: #8f8470;
            --cast: rgba(50, 35, 20, .28);
            --eye-op: 0;
            --fire-glow: rgba(255, 196, 120, .55);
            --fire-light: rgba(255, 190, 110, .55);
            --flame-yellow: #FDE26C;
            --flame-orange: #FDA263;
            --flame-core: #fff8e6;
            --ember: #e0562a;
            --smoke: #5a4a3a;
            --spark: #ffb347;
        }

        [data-bs-theme="dark"] {
            --sky-top: #05080e;
            --sky-mid: #0e1520;
            --sky-bottom: #1d1c1f;
            --moon: #f3ead2;
            --moon-shade: #d9ceb1;
            --moon-halo: rgba(243, 234, 210, .18);
            --star-op: 1;
            --hill: #121a1d;
            --cliff: #0b0f12;
            --wolf: #07090b;
            --tree-far: #151e1c;
            --tree-mid: #0d1412;
            --tree-near: #070c0a;
            --ground: #10140f;
            --dirt: #2e2318;
            --bark-dark: #1c130c;
            --bark-mid: #3d2817;
            --bark-lit: #b06a32;
            --bark-line: #120c07;
            --wood-end: #c98a4c;
            --ring: #8a5a2e;
            --wood-hi: #e8a865;
            --moss: #2c3519;
            --rim: #ffb060;
            --mushroom: #8a3424;
            --stone: #4f3d2e;
            --cast: rgba(0, 0, 0, .5);
            --eye-op: 1;
            --fire-glow: rgba(253, 150, 80, .6);
            --fire-light: rgba(240, 130, 60, .55);
            --flame-yellow: #FDE26CAA;
            --flame-orange: #FDA263DD;
            --flame-core: #fff3c4;
            --ember: #ff6a2a;
            --smoke: #fff;
            --spark: #ffc266;
        }

        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            position: relative;
            background: linear-gradient(var(--sky-top), var(--sky-mid) 42%, var(--sky-bottom) 58%);
        }

        svg { position: absolute; overflow: visible; }

        /* Layers, back to front: stars, moon + howling wolf, forest + ground, clearing with the fire circle. */
        .stars-l { top: 0; left: 0; width: 100vw; height: 55vh; opacity: var(--star-op); fill: #f3e6c8; }
        .wolf-l { top: 10vh; right: 5vw; height: 47vh; }
        .forest-l { left: 0; bottom: 0; width: 100vw; height: 100vh; }
        /* The fire sits just above the bottom edge, below the centred login card; the stumps ring
           spreads wider than the card so the side seats stay visible around it. */
        .clearing-l {
            left: 50%;
            bottom: -10vw;
            width: clamp(620px, 100vw, 1500px);
            transform: translateX(-50%);
        }

        /* Portrait phones: lower horizon, closer fire, so no empty band of ground between them. */
        @media (max-aspect-ratio: 3/4) {
            .forest-l { height: 75vh; }
            .wolf-l { top: 22vh; right: 2vw; height: 42vh; }
            .clearing-l { width: 230vw; bottom: -14vw; }
        }

        /* Phones: the login card fills the lower 60%, so the whole scene moves into the top band:
           horizon at 26vh, fire at 36vh just above the card, small moon and wolf top right. */
        @media (max-width: 767px) {
            body { background: linear-gradient(var(--sky-top), var(--sky-mid) 14%, var(--sky-bottom) 26%, var(--ground) 26%); }
            .forest-l { top: 0; bottom: auto; height: 47vh; }
            .wolf-l { top: 12vh; right: 2vw; height: 15vh; }
            .clearing-l { top: calc(36vh - 125px); bottom: auto; width: 500px; }
        }

        .moon { fill: var(--moon); }
        .moon-shade { fill: var(--moon-shade); }
        .moon-halo { fill: url(#moonHalo); }
        .cliff { fill: var(--cliff); }
        .wolf { fill: var(--wolf); }
        .hill { fill: var(--hill); }
        .tree-far { fill: var(--tree-far); }
        .tree-mid { fill: var(--tree-mid); }
        .tree-near { fill: var(--tree-near); }

        /* Seats: rustic cut stumps and a log bench, lit from the fire side. */
        .bark-lines { fill: none; stroke: var(--bark-line); stroke-width: 1.4; stroke-linecap: round; opacity: .6; }
        .crack { fill: none; stroke: var(--bark-line); stroke-width: 1.6; stroke-linejoin: round; }
        .moss { fill: var(--moss); }
        .grass { fill: var(--moss); }
        .mushroom { fill: var(--mushroom); }
        .rings { fill: none; stroke: var(--ring); stroke-width: .9; }
        .rim { fill: none; stroke: var(--rim); stroke-width: 1.6; stroke-linecap: round; opacity: .85; }
        .rim-side { fill: none; stroke: var(--rim); stroke-width: 1.6; stroke-linecap: round; opacity: .6; }
        .ground { fill: var(--ground); }
        .clearing { fill: url(#clearing); }
        .stone { fill: var(--stone); }
        .log { fill: var(--bark-mid); }
        .log-dark { fill: var(--bark-dark); }
        .log-end { fill: var(--wood-end); }
        .ember { fill: var(--ember); }

        .eyes { opacity: var(--eye-op); fill: #ffd36b; }
        .eye-pair { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
        .eye-pair:nth-child(2) { animation-delay: -2.5s; animation-duration: 9s; }
        .eye-pair:nth-child(3) { animation-delay: -5s; animation-duration: 11s; }
        @keyframes blink {
            0%, 46%, 50%, 100% { transform: scaleY(1); }
            48% { transform: scaleY(.1); }
        }

        .twinkle { animation: twinkle 4s ease-in-out infinite alternate; }
        .twinkle.t2 { animation-delay: -1.5s; animation-duration: 5s; }
        .twinkle.t3 { animation-delay: -3s; animation-duration: 3.5s; }
        @keyframes twinkle {
            from { opacity: 1; }
            to { opacity: .3; }
        }

        /* Campfire: same flames as homeBackground.html (three stacked diamonds + flicker), larger. */
        .fire-glow { fill: url(#fireGlow); animation: pulse 3s ease-in-out infinite alternate; }
        .fire-light { fill: url(#fireLight); animation: pulse 3.6s ease-in-out infinite alternate-reverse; }
        @keyframes pulse {
            from { opacity: .8; }
            to { opacity: 1; }
        }
        .fire { transform: rotate(-5deg); animation: flicker 3s ease alternate infinite; }
        .fire.f2 { animation-duration: 2.3s; animation-delay: -1s; }
        .fire.f3 { animation-duration: 2.7s; animation-delay: -.4s; }
        .flame-1 { fill: var(--flame-yellow); opacity: .4; }
        .flame-2 { fill: var(--flame-orange); opacity: .8; }
        .flame-3 { fill: var(--flame-core); opacity: .9; }
        @keyframes flicker {
            0% { transform: rotate(-1deg); }
            20% { transform: rotate(1deg); }
            40% { transform: rotate(-1deg); }
            60% { transform: rotate(1deg) scale(1.1); }
            80% { transform: rotate(-2deg) scale(1); }
            100% { transform: rotate(1deg); }
        }

        .smoke {
            fill: none;
            stroke: var(--smoke);
            opacity: .3;
            stroke-width: 5px;
            stroke-dasharray: 500 100;
            stroke-linecap: round;
            animation: dash 3s linear infinite;
        }
        @keyframes dash {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 600; }
        }

        .spark {
            fill: var(--spark);
            opacity: 0;
            animation: rise var(--t, 2.6s) ease-out var(--d, 0s) infinite;
        }
        @keyframes rise {
            0% { transform: translate(0, 0); opacity: 0; }
            12% { opacity: 1; }
            100% { transform: translate(var(--dx, 10px), var(--dy, -150px)); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; }
            .spark { display: none; }
        }
    </style>
</head>
