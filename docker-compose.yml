services:
  web:
    image: eclipse-temurin:17-jre
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      - TZ=Europe/Rome
    command: ["java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005", "-jar", "/app/lupus.jar"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./target/lupus-1.00.jar:/app/lupus.jar

  db:
    image: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Europe/Rome
    volumes:
      - ./src/main/database:/docker-entrypoint-initdb.d/
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 10s
      retries: 50

  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
